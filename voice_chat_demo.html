<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z99 | Premium AI Voice Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            display: flex;
            align-items: center;
            font-size: 13px;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        /* Messages */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .voice-playback {
            margin-top: 8px;
            width: 100%;
            height: 32px;
        }

        /* Input Controls */
        .controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        input[type="password"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-send {
            background: var(--primary);
        }

        .btn-record.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .hidden {
            display: none;
        }

        .token-bar {
            font-size: 11px;
            margin-bottom: 5px;
            opacity: 0.6;
        }

        .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="chat-header">
            <div>
                <h3 style="margin:0; font-weight: 600;">Z99 AI Voice Chat</h3>
                <div class="token-bar" id="server-info">Target: ws://10.10.13.60:8082/ws/chat/{session_id}</div>
            </div>
            <div class="status">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div id="chat-messages">
            <div class="message ai">
                Welcome! Enter your Session ID and Token below to start the premium voice experience.
            </div>
        </div>

        <div class="controls">
            <div class="input-row">
                <input type="text" id="session-id" placeholder="Session ID (e.g. 332)" value="332">
                <input type="password" id="auth-token" placeholder="JWT Auth Token"
                    value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzY5NTc2NjE5LCJpYXQiOjE3Njk1NDc4MTksImp0aSI6IjAyNWY4NmNhZmVjYzRhZWVhZTAzMzM3Mzk2YjY2NjU4IiwidXNlcl9pZCI6IjIifQ.YBaLoAz5AKF_8rleOLFfcEnJrHDL2bHUEmS4Zwg_gP0">
                <button class="btn btn-send" onclick="connectWS()">Connect</button>
            </div>

            <div class="input-row">
                <input type="text" id="text-msg" placeholder="Type a message or record voice...">
                <button id="record-btn" class="btn btn-record" onclick="toggleRecording()">
                    🎤 <span id="record-label">Record</span>
                </button>
                <input type="file" id="file-input" class="hidden" accept="audio/*" onchange="handleFileUpload(this)">
                <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
                <button class="btn btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // Configuration
        // Configuration - Update these to match your backend server
        const SERVER_HOST = '10.10.13.60';  // Your backend server IP
        const SERVER_PORT = '8082';          // Your backend server port
        const WS_PROTOCOL = 'ws:';           // 'ws:' for HTTP, 'wss:' for HTTPS

        // 1. WebSocket Connection
        function connectWS() {
            const sessionId = document.getElementById('session-id').value;
            const token = document.getElementById('auth-token').value;

            if (!sessionId || !token) {
                alert("Please enter Session ID and Token!");
                return;
            }

            // Clear previous messages
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = '';

            const wsUrl = `${WS_PROTOCOL}//${SERVER_HOST}:${SERVER_PORT}/ws/chat/${sessionId}/?token=${token}`;
            document.getElementById('server-info').innerText = `Connecting to: ${wsUrl}`;
            
            try {
                socket = new WebSocket(wsUrl);
            } catch (err) {
                appendMessage("system", `Connection error: ${err.message}`);
                return;
            }

            socket.onopen = () => {
                document.getElementById('status-dot').classList.add('online');
                document.getElementById('status-text').innerText = "Connected";
                appendMessage("system", "Connected to AI server. Loading chat history...");
            };

            socket.onclose = (event) => {
                document.getElementById('status-dot').classList.remove('online');
                const reason = event.reason || "Unknown reason";
                const code = event.code || "No code";
                document.getElementById('status-text').innerText = `Disconnected (${code})`;
                console.error(`DEBUG: Socket Closed. Code: ${code}, Reason: ${reason}`);

                if (code === 1009) {
                    alert("ERROR: Message is too large! Try a shorter voice clip.");
                } else if (code === 1006) {
                    alert("ERROR: Server crashed or connection lost. Check server logs.");
                } else if (code === 1000) {
                    console.log("Normal disconnection");
                }
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                document.getElementById('status-dot').classList.remove('online');
                document.getElementById('status-text').innerText = "Connection Error";
                appendMessage("system", "WebSocket connection error. Check your connection.");
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log("Received:", data);

                    if (data.type === "new_message") {
                        appendMessage("ai", data.message.content, data.message.voice);
                    } else if (data.type === "previous_messages") {
                        // Mark previous messages
                        console.log("Loading previous messages:", data.messages);
                        data.messages.forEach(msg => {
                            appendMessage(msg.sender, msg.content, msg.voice, true);
                        });
                    } else if (data.type === "error") {
                        appendMessage("system", "Error: " + data.message);
                    } else if (data.remaining_credits !== undefined) {
                        console.log("Remaining credits:", data.remaining_credits);
                    }
                } catch (e) {
                    console.error("Failed to parse message:", e);
                }
            };
        }

        // 2. Message Handling
        function appendMessage(sender, text, voiceUrl = null, isPrevious = false) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${sender === 'system' ? 'ai' : sender}`;
            
            // Mark previous messages with reduced opacity
            if (isPrevious) {
                div.style.opacity = '0.7';
            }

            let content = `<div>${text || ''}</div>`;
            if (voiceUrl) {
                content += `<audio controls class="voice-playback" src="${voiceUrl}"></audio>`;
            }

            div.innerHTML = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage(audioBase64 = null) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert("Not connected! Please connect first.");
                return;
            }

            const text = document.getElementById('text-msg').value;
            
            // Don't send empty messages
            if (!text && !audioBase64) {
                alert("Please enter a message or record audio");
                return;
            }

            const payload = {
                "message": text,
                "images": [],
                "voice": audioBase64
            };

            const jsonStr = JSON.stringify(payload);
            console.log(`DEBUG: Sending message. Size: ${(jsonStr.length / 1024).toFixed(2)} KB`);

            try {
                socket.send(jsonStr);
                
                // Only clear text input, not audio
                document.getElementById('text-msg').value = "";

                // Show optimistic UI for user message
                if (!audioBase64) {
                    appendMessage("user", text);
                } else {
                    appendMessage("user", text || "🎤 Voice Message", null);
                }
            } catch (err) {
                console.error("DEBUG: Send failed:", err);
                appendMessage("system", "Error: Failed to send message. " + err.message);
            }
        }

        // 3. Audio Recording
        async function toggleRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            sendMessage(base64Audio);
                        };
                        reader.onerror = () => {
                            appendMessage("system", "Error reading audio file.");
                        };
                    };

                    mediaRecorder.start();
                    document.getElementById('record-btn').classList.add('recording');
                    document.getElementById('record-label').innerText = "Stop";
                    isRecording = true;
                } catch (err) {
                    appendMessage("system", `Microphone access denied: ${err.message}`);
                    console.error("Microphone error:", err);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    document.getElementById('record-btn').classList.remove('recording');
                    document.getElementById('record-label').innerText = "Record";
                    isRecording = false;
                }
            }
        }

        // 4. File Upload
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            if (!file.type.startsWith('audio/')) {
                appendMessage("system", "Error: Please select an audio file.");
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = () => {
                const base64Audio = reader.result;
                sendMessage(base64Audio);
            };
            reader.onerror = () => {
                appendMessage("system", "Error reading file.");
            };
        }
    </script>

</body>

</html>
